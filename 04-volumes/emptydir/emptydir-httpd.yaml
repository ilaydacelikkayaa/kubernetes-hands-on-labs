apiVersion: v1
kind: Pod

metadata:
  name: web-emptydir

spec:
  containers:
    - name: web
      image: httpd
      volumeMounts:
        - name: cache-memory
          mountPath: /cache

    - name: logs
      image: alpine
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: cache-memory
          mountPath: /cache

  volumes:
    - name: cache-memory
      emptyDir: {}