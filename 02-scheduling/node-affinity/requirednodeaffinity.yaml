apiVersion: v1
kind: Pod
metadata:
  name: nodeaffinity

spec:
  containers:
    - name: nginx-container
      image: nginx

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: disksize
                operator: In
                values:
                  - large
                  - medium