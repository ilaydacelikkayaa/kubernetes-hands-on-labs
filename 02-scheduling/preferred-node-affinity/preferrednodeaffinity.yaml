apiVersion: v1
kind: Pod
metadata:
  name: nodeaffinity

spec:
  containers:
    - name: nginx-create
      image: nginx

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 5
          preference:
            matchExpressions:
              - key: disktype
                operator: In
                values:
                  - fast

        - weight: 10
          preference:
            matchExpressions:
              - key: hardware
                operator: In
                values:
                  - high